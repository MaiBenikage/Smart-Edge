name: CI

# Runs the unit tests on every push and pull request to master, so a
# broken change is caught before it is tagged for release. The release
# workflow (.github/workflows/release.yml) additionally gates its release
# build on the same test task — a release build never runs unless the
# tests pass first.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # No setup-android step: ubuntu-latest runners ship a preinstalled
      # Android SDK, and android-actions/setup-android@v3 fails because it
      # tries to install the obsolete 'tools' package (sdkmanager reports
      # "Failed to find package 'tools'"). The release workflow's build
      # job already builds against the preinstalled SDK.
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/testDebugUnitTest
