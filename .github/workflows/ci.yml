name: CI

# Runs the unit tests on every push and pull request to master, so a
# broken change is caught before it is tagged for release. The release
# workflow (.github/workflows/release.yml) additionally gates its release
# build on the same test job — a release build never runs unless the
# tests pass first. The test job itself lives in test.yml (reusable
# workflow) so it is defined once, not duplicated across workflows.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/test.yml
