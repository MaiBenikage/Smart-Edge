name: Unit tests (reusable)

# Shared by ci.yml (every push/PR to master) and release.yml (which gates
# its release build on this job), so the test steps live in exactly one
# place instead of being duplicated across both workflows.
on:
  workflow_call:
    inputs:
      ref:
        description: 'Ref to check out (tag or branch). Empty means the calling run''s ref.'
        type: string
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Test the same code the caller builds: release.yml passes
          # inputs.tag here, so a manual release tests the tag it will
          # sign, not the branch selected in the UI. An empty ref falls
          # back to the run's ref (checkout v5: an empty ref input
          # resolves to github.context.ref), so a tag push still tests
          # the tag and callers that pass nothing (ci.yml) are unchanged.
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      # No setup-android step: ubuntu-latest runners ship a preinstalled
      # Android SDK, and android-actions/setup-android@v3 fails because it
      # tries to install the obsolete 'tools' package (sdkmanager reports
      # "Failed to find package 'tools'"). The build job already builds
      # against the preinstalled SDK.
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: test-reports
          path: app/build/reports/tests/testDebugUnitTest
