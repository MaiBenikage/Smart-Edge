name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.5.4)'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Unit tests run FIRST (shared reusable job from test.yml). The release
  # build below depends on this job, so a release APK is never built (or
  # published) when the tests fail. The tag is passed through so the tests
  # validate the same code the build signs: for a manual run that is
  # inputs.tag, for a tag push it is empty and test.yml falls back to
  # the run's ref (the tag).
  test:
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ inputs.tag }}

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          # For a manual (workflow_dispatch) run, build the tag given in
          # inputs.tag, not the branch selected in the UI — the release
          # must be published under the tag it names. When inputs.tag is
          # empty (a tag push), checkout falls back to the run's ref
          # (checkout v5: an empty ref input resolves to github.context.ref),
          # so the tag-triggered path is unchanged. A tag that does not
          # resolve fails the checkout, which is the desired fail-closed
          # behaviour.
          ref: ${{ inputs.tag }}

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Resolve tag name
        id: tag
        # inputs.tag is read through an env var, never interpolated into
        # the script: the value is operator-supplied free text, and
        # ${{ }} inside a run: block is substituted into the shell before
        # execution, so a value containing $(), backticks or quotes could
        # run arbitrary commands on a runner holding the signing secrets.
        # The strict pattern below rejects anything but a plain version
        # tag before the value is used.
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          if [ -n "$TAG_INPUT" ]; then
            if ! [[ "$TAG_INPUT" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Invalid tag '$TAG_INPUT' - expected a version tag like v1.5.4."
              exit 1
            fi
            TAG="$TAG_INPUT"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # Fail fast on a missing changelog section, before any signing
      # material is decoded or the APK is built. The Extract Changelog
      # step below runs the same section-presence check and also fails,
      # but only after the keystore has been decoded and the release
      # built — a bad tag should never reach that far. This step only
      # gates; Extract Changelog still runs below to produce the notes.
      - name: Check changelog has a section for the tag
        run: |
          TAG_NAME="${{ steps.tag.outputs.tag }}"
          # Same section extraction as Extract Changelog: the section
          # under a header line, up to the next '###' header or '---'
          # separator. Matches the header exactly, or the header
          # followed by " (" (for a " (Latest)" suffix) — index() does
          # literal matching, so the dots in the version are not regex
          # wildcards (v1.3.8 must not match v1x3y8, nor v1.3.80).
          extract_section() {
            awk -v header="$1" '
              /^### / { flag = 0 }
              $0 == header || index($0, header " (") == 1 { flag = 1; next }
              /^---/ { flag = 0 }
              flag
            ' CHANGELOG.md
          }
          BODY=$(extract_section "### $TAG_NAME")
          # No silent fallback to '### Unreleased': a tag without its own
          # section used to ship the Unreleased notes, so v1.5.4 and v1.5.5
          # published byte-identical bodies. Fail instead and tell the
          # author to add the section.
          if [ -z "$(echo "$BODY" | tr -d '[:space:]')" ]; then
            echo "::error::No '### $TAG_NAME' section in CHANGELOG.md - add a '### $TAG_NAME' section to CHANGELOG.md before tagging; refusing to build a release with another version's notes."
            exit 1
          fi

      - name: Decode Keystore
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          printf '%s' "$RELEASE_KEYSTORE" | base64 --decode > app/release.keystore

      - name: Create keystore.properties
        env:
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          {
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
            echo "STORE_FILE=release.keystore"
            echo "STORE_PASSWORD=$STORE_PASSWORD"
          } > keystore.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease -PversionName="${{ steps.tag.outputs.version }}"

      - name: Extract Changelog
        id: changelog
        run: |
          TAG_NAME="${{ steps.tag.outputs.tag }}"
          # Extract the section under a header line, up to the next '###'
          # header or '---' separator. Matches the header exactly, or the
          # header followed by " (" (for a " (Latest)" suffix) — index()
          # does literal matching, so the dots in the version are not
          # regex wildcards (v1.3.8 must not match v1x3y8, nor v1.3.80).
          # The '/^### / { flag = 0 }' rule comes first so a later header
          # ends the section, but the matched header still sets flag = 1
          # in the rule below it.
          extract_section() {
            awk -v header="$1" '
              /^### / { flag = 0 }
              $0 == header || index($0, header " (") == 1 { flag = 1; next }
              /^---/ { flag = 0 }
              flag
            ' CHANGELOG.md
          }
          BODY=$(extract_section "### $TAG_NAME")
          # No silent fallback to '### Unreleased': a tag without its own
          # section used to ship the Unreleased notes, so v1.5.4 and v1.5.5
          # published byte-identical bodies. Fail instead and tell the
          # author to add the section.
          if [ -z "$(echo "$BODY" | tr -d '[:space:]')" ]; then
            echo "::error::No '### $TAG_NAME' section in CHANGELOG.md - add a '### $TAG_NAME' section to CHANGELOG.md before tagging; refusing to publish a release with another version's notes."
            exit 1
          fi
          delim=$(openssl rand -hex 16)
          {
            echo "body<<$delim"
            echo "$BODY"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

      - name: Upload APK to Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: app/build/outputs/apk/release/app-release.apk
          body: ${{ steps.changelog.outputs.body }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The signing key and its passwords must not survive the job: the
      # runner is ephemeral, but the files are on disk while the job runs.
      - name: Remove signing material
        if: always()
        run: rm -f app/release.keystore keystore.properties
