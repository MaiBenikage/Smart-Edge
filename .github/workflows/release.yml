name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # Unit tests run FIRST (shared reusable job from test.yml). The release
  # build below depends on this job, so a release APK is never built (or
  # published) when the tests fail.
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Decode Keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode > app/release.keystore

      - name: Create keystore.properties
        run: |
          echo "KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}" > keystore.properties
          echo "KEY_PASSWORD=<redacted>"
          echo "STORE_FILE=release.keystore" >> keystore.properties
          echo "STORE_PASSWORD=<redacted>"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Extract Changelog
        id: changelog
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          # Extract the section under a header line, up to the next '---'
          # separator. Matches the header exactly, or the header followed
          # by " (" (for the " (Latest)" suffix) — index() does literal
          # matching, so the dots in the version are not regex wildcards
          # (v1.3.8 must not match v1x3y8, nor v1.3.80).
          extract_section() {
            awk -v header="$1" '
              $0 == header || index($0, header " (") == 1 { flag = 1; next }
              /^---/ { flag = 0 }
              flag
            ' CHANGELOG.md
          }
          BODY=$(extract_section "### $TAG_NAME")
          if [ -z "$(echo "$BODY" | tr -d '[:space:]')" ]; then
            echo "No '### $TAG_NAME' section in CHANGELOG.md; falling back to '### Unreleased'."
            BODY=$(extract_section "### Unreleased")
          fi
          if [ -z "$(echo "$BODY" | tr -d '[:space:]')" ]; then
            echo "::error::No changelog section for '$TAG_NAME' or 'Unreleased' in CHANGELOG.md — refusing to publish an empty release body."
            exit 1
          fi
          {
            echo 'body<<EOF'
            echo "$BODY"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: app/build/outputs/apk/release/app-release.apk
          body: ${{ steps.changelog.outputs.body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
